services:
  postgres:
    image: postgres:16-alpine
    container_name: ghazala-store-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ghazala
      POSTGRES_PASSWORD: ghazala_dev_password
      POSTGRES_DB: ghazala_store
    volumes:
      - ghazala_pg_data:/var/lib/postgresql/data

volumes:
  ghazala_pg_data:
